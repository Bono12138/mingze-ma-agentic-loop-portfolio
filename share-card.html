<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>马铭泽｜项目履历速览</title>
    <link rel="stylesheet" href="assets/share-card.css?v=20260806-6">
    <script defer src="assets/share-card.js?v=20260806-6"></script>
  </head>
  <body>
    <main class="share-card" aria-label="项目履历速览">
      <header class="card-header">
        <div>
          <p class="card-eyebrow" data-copy="eyebrow"></p>
          <h1 data-copy="title"></h1>
          <p class="card-summary" data-copy="summary"></p>
        </div>
        <div class="card-name">
          <strong data-copy="name"></strong>
          <span>Mingze Ma</span>
        </div>
      </header>

      <div class="card-domains" id="card-domains"></div>

      <section class="experience experience-a">
        <div class="experience-copy">
          <span class="experience-number">01</span>
          <h2 data-copy="case1Title"></h2>
          <p data-copy="case1Body"></p>
        </div>
        <div class="experience-image">
          <img data-image="audit" src="assets/images/audit-sc.png" alt="">
        </div>
      </section>

      <section class="experience experience-b">
        <div class="experience-image">
          <img data-image="layers" src="assets/images/layers-sc.png" alt="">
        </div>
        <div class="experience-copy">
          <span class="experience-number">02</span>
          <h2 data-copy="case2Title"></h2>
          <p data-copy="case2Body"></p>
        </div>
      </section>

      <section class="experience experience-c">
        <div class="experience-copy">
          <span class="experience-number">03</span>
          <h2 data-copy="case3Title"></h2>
          <p data-copy="case3Body"></p>
        </div>
        <div class="case-strip">
          <figure><img src="assets/images/bono-insight-plugin.png" alt="Bono Insight"></figure>
          <figure><img src="assets/images/quota-capsule.png" alt="Quota Capsule"></figure>
          <figure class="worldcup"><img src="assets/images/worldcup-rank-room-live-20260806.png" alt="World Cup Rank Room"></figure>
        </div>
      </section>

      <footer class="card-footer">
        <img class="qr" src="downloads/portfolio-qr.png" alt="项目履历网站二维码">
        <div class="footer-copy">
          <p class="footer-label" data-copy="scan"></p>
          <strong data-copy="footerTitle"></strong>
          <span class="footer-url">bono12138.github.io/mingze-ma-agentic-loop-portfolio/</span>
        </div>
        <div class="language-note">简体中文 · 繁體中文 · English</div>
      </footer>
    </main>
  </body>
</html>
